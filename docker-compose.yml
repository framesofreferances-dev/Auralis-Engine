services:
  auralis:
    build: .
    environment:
      AURALIS_YTDLP_POT_BASE_URL: http://bgutil-provider:4416
    depends_on:
      bgutil-provider:
        condition: service_healthy
    volumes:
      - ./assets:/app/assets
      - ./data:/app/data

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    init: true
    restart: unless-stopped
    expose:
      - "4416"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:4416/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
